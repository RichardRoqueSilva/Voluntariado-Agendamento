server.port=${API_PORT:8080}
spring.application.name=agendamento
spring.datasource.url=jdbc:h2:file:./data/agendamento_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

voluntariado.origenspermitidas=${API_ORIGENS_PERMITIDAS:http://localhost:4200,http://127.0.0.1:4200}