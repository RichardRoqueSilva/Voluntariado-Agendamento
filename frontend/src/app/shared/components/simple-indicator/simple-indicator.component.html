<mat-card class="indicator-card" appearance="outlined">
  <mat-card-content class="indicador-content">
    <span class="content-value">{{ value == null ? valueIfNull : value }}</span>
    <span class="content-title">{{ title }}</span>
  </mat-card-content>
</mat-card>
<app-spinner-indicator *ngIf="loading"></app-spinner-indicator>
