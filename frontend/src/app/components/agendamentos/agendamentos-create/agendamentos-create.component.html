<mat-card>
  <mat-card-title>Nova Entidade</mat-card-title>
  <form>
    <mat-form-field>
      <input
        matInput
        type="hidden"
        [(ngModel)]="agendamentos.entidadeId"
        name="id"
      />
    </mat-form-field>
    <mat-form-field>
      <input
        matInput
        placeholder="Dias de Visita"
        [(ngModel)]="agendamentos.diasVisita"
        name="visita"
      />
    </mat-form-field>
  </form>

  <div>
    <button
      class="dp-btn-primary"
      mat-raised-button
      (click)="createAgendamentos()"
    >
      Salvar
    </button>

    <button mat-raised-button (click)="cancel()">Cancelar</button>
  </div>
</mat-card>
