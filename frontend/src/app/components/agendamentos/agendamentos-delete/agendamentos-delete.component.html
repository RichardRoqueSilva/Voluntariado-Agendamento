<mat-card>
  <mat-card-title>Excluir Voluntário</mat-card-title>
  <form>
    <mat-form-field>
      <input
        matInput
        placeholder="Nome"
        [value]="agendamentos.entidade.nome"
        name="nome"
        disabled=""
      />
    </mat-form-field>
    <mat-form-field>
      <input
        matInput
        placeholder="Dias de Visita"
        [value]="agendamentos.diasVisita"
        name="diasVisita"
        disabled=""
      />
    </mat-form-field>
  </form>

  <div>
    <button
      class="dp-btn-alert"
      mat-raised-button
      (click)="deleteAgendamentos()"
    >
      Excluir
    </button>

    <button mat-raised-button (click)="cancel()">Cancelar</button>
  </div>
</mat-card>
