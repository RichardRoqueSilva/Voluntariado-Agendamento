<mat-card>
  <mat-card-title>Alterar Voluntário</mat-card-title>
  <form>
    <mat-form-field>
      <input
        matInput
        placeholder="nome:"
        [(ngModel)]="agendamentos.entidade.nome"
        name="nome"
      />
    </mat-form-field>
    <mat-form-field>
      <input
        matInput
        placeholder="visita:"
        [(ngModel)]="agendamentos.diasVisita"
        name="visita"
      />
    </mat-form-field>
  </form>

  <div>
    <button
      class="dp-btn-primary"
      mat-raised-button
      (click)="updateAgendamentos()"
    >
      Atualizar
    </button>

    <button mat-raised-button (click)="cancel()">Cancelar</button>
  </div>
</mat-card>
