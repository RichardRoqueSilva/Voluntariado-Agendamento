<div class="mat-elevation-z4">
  <table mat-table [dataSource]="voluntarios">
    <!-- ID Column -->
    <!--<ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef >ID</th>
        <td mat-cell *matCellDef="let row">{{row.id}}</td>
      </ng-container>-->

    <!-- Name Column -->
    <ng-container matColumnDef="nome">
      <th mat-header-cell *matHeaderCellDef>Nome</th>
      <td mat-cell *matCellDef="let row">
        {{ row.nome }}
      </td>
    </ng-container>

    <!-- Celular Column -->
    <ng-container matColumnDef="celular">
      <th mat-header-cell *matHeaderCellDef>Celular</th>
      <td mat-cell *matCellDef="let row">
        {{ row.celular | mask : '(00) 00000-0000' }}
      </td>
    </ng-container>

    <!-- Observação Column -->
    <ng-container matColumnDef="observacao">
      <th mat-header-cell *matHeaderCellDef>Observação</th>
      <td mat-cell *matCellDef="let row">
        {{ row.observacao }}
      </td>

      <!-- Action Column -->
      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let row">
          <div class="dp-tabela-acoes">
            <a
              mat-icon-button
              routerLink="/voluntarios/update/{{ row.id }}"
              class="dp-tabela-edit"
              matTooltip="Editar voluntário"
            >
              <i class="material-icons"> edit </i>
            </a>
            <a
              mat-icon-button
              routerLink="/voluntarios/delete/{{ row.id }}"
              class="dp-tabela-delete"
              matTooltip="Excluir voluntário"
            >
              <i class="material-icons"> delete </i>
            </a>
          </div>
        </td>
      </ng-container>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
