<mat-card>
  <mat-card-title>Nova Entidade</mat-card-title>
  <form #entidadesForm="ngForm">
    <mat-form-field>
      <input
        matInput
        type="text"
        placeholder="Nome da Entidade"
        [(ngModel)]="entidades.nome"
        required
        name="nome"
      />
    </mat-form-field>

    <mat-form-field>
      <input
        matInput
        type="text"
        placeholder="Endereço"
        [(ngModel)]="entidades.endereco"
        required
        name="endereco"
      />
    </mat-form-field>

    <mat-form-field>
      <input
        matInput
        type="text"
        placeholder="Responsável"
        [(ngModel)]="entidades.responsavel"
        name="responsavel"
      />
    </mat-form-field>

    <mat-form-field>
      <input
        matInput
        type="text"
        mask="(00) 00000-0000"
        [showMaskTyped]="true"
        placeholder="Telefone"
        [(ngModel)]="entidades.telefone"
        name="telefone"
      />
    </mat-form-field>

    <mat-form-field>
      <mat-select
        placeholder="Dias de Visita"
        [(ngModel)]="entidades.diasVisita"
        required
        multiple
        name="diasVisita"
      >
        @for (dia of diasDaSemana; track dia) {
        <mat-option [value]="dia.descricao">{{ dia.descricao }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field>
      <input
        matInput
        type="text"
        placeholder="Horário de início da visita"
        [(ngModel)]="entidades.horarioInicioVisita"
        [matTimepicker]="horarioInicioPicker"
        required
        readonly
        name="horarioInicioVisita"
      />
      <mat-timepicker-toggle matIconSuffix [for]="horarioInicioPicker" />
      <mat-timepicker interval="15min" #horarioInicioPicker />
    </mat-form-field>

    <mat-form-field>
      <input
        matInput
        type="text"
        placeholder="Horario de término da visita"
        [(ngModel)]="entidades.horarioFimVisita"
        [matTimepicker]="horarioFimPicker"
        readonly
        required
        name="horarioFimVisita"
      />
      <mat-timepicker-toggle matIconSuffix [for]="horarioFimPicker" />
      <mat-timepicker interval="15min" #horarioFimPicker />
    </mat-form-field>
  </form>

  <div>
    <button mat-raised-button (click)="createEntidades()" color="primary">
      Salvar
    </button>

    <button mat-raised-button (click)="cancel()">Cancelar</button>
  </div>
</mat-card>
