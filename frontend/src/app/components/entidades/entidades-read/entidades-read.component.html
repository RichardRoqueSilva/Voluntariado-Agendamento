<div class="mat-elevation-z4">
  <table mat-table [dataSource]="entidades">
    <!-- ID Column -->
    <!--<ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef >ID</th>
        <td mat-cell *matCellDef="let row">{{row.id}}</td>
      </ng-container>-->

    <!-- Name Column -->
    <ng-container matColumnDef="nome">
      <th mat-header-cell *matHeaderCellDef>Nome</th>
      <td mat-cell *matCellDef="let row">
        {{ row.nome }}
      </td>
    </ng-container>

    <!-- Endereco Column -->
    <ng-container matColumnDef="endereco">
      <th mat-header-cell *matHeaderCellDef>Endereço</th>
      <td mat-cell *matCellDef="let row">
        {{ row.endereco }}
      </td>
    </ng-container>

    <!-- Responsavel Column -->
    <ng-container matColumnDef="responsavel">
      <th mat-header-cell *matHeaderCellDef>Responsável</th>
      <td mat-cell *matCellDef="let row">
        {{ row.responsavel }}
      </td>
    </ng-container>

    <!-- telefone Column -->
    <ng-container matColumnDef="telefone">
      <th mat-header-cell *matHeaderCellDef>Telefone</th>
      <td mat-cell *matCellDef="let row">
        {{ row.telefone | mask : '(00) 00000-0000' }}
      </td>
    </ng-container>

    <!-- Celular Column -->
    <ng-container matColumnDef="dias">
      <th mat-header-cell *matHeaderCellDef>Dias de Visita</th>
      <td mat-cell *matCellDef="let row">
        {{ row.diasVisita }}
      </td>
    </ng-container>

    <!-- Horario Column -->
    <ng-container matColumnDef="horario">
      <th mat-header-cell *matHeaderCellDef>Horário de visita</th>
      <td mat-cell *matCellDef="let row">
        {{ row.horarioInicioVisita }} até {{ row.horarioFimVisita }}
      </td>
    </ng-container>

    <!-- Action Column -->
    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef>Ações</th>
      <td mat-cell *matCellDef="let row">
        <div class="dp-tabela-acoes">
          <a
            class="dp-tabela-edit"
            mat-icon-button
            matTooltip="Editar entidade"
            routerLink="/entidades/update/{{ row.id }}"
          >
            <i class="material-icons"> edit </i>
          </a>
          <a
            class="dp-tabela-delete"
            mat-icon-button
            matTooltip="Excluir entidade"
            routerLink="/entidades/delete/{{ row.id }}"
          >
            <i class="material-icons"> delete </i>
          </a>
        </div>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
