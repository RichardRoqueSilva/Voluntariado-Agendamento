<button
  class="dp-btn-criar dp-btn-primary"
  mat-raised-button
  (click)="abrirModal()"
>
  Novo Agendamento
</button>

<app-modal-agendamento
  *ngIf="mostrarModal"
  [modo]="modo"
  (fechar)="fecharModal()"
  (salvar)="salvarAgendamento($event)"
>
</app-modal-agendamento>

<app-agendamentos-read></app-agendamentos-read>
